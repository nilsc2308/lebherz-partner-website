[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


# Weiterleitungen alter Adressen von ib-lup.de
[[redirects]]
  from = "/engineering-services.html"
  to = "/engineering.html"
  status = 301

[[redirects]]
  from = "/team.html"
  to = "/ueber-uns.html"
  status = 301

[[redirects]]
  from = "/datenschutzerklaerung.html"
  to = "/datenschutz.html"
  status = 301

[[redirects]]
  from = "/cookieeinstellungen.html"
  to = "/datenschutz.html"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
